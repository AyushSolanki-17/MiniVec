name: CI

# Fast checks for every pull request: lint, build, and the quick unit tests.
# Slow, timing-sensitive and sanitizer runs live in full-tests.yml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.0
      - run: ruff check .

  cpp:
    name: C++ build and quick tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps/*-src
          key: deps-${{ runner.os }}-${{ hashFiles('cpp/CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
          -DMINIVEC_BUILD_PYTHON=OFF -DMINIVEC_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build -j 4

      # Benchmark-style and wall-clock latency tests run in full-tests.yml.
      - name: Quick tests
        run: >
          ctest --test-dir build --output-on-failure -j 4 -LE stress
          -E "HNSWBenchmark\\.|HNSWLatency\\."

  python:
    name: Python package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install . pytest
      - run: python -m pytest -q
