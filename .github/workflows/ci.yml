name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v5

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps/*-src
          key: deps-${{ runner.os }}-${{ hashFiles('cpp/CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
          -DMINIVEC_BUILD_PYTHON=OFF -DMINIVEC_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4 -LE stress

  sanitize:
    name: Sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v5

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps/*-src
          key: deps-${{ runner.os }}-${{ hashFiles('cpp/CMakeLists.txt') }}

      # Newer Ubuntu kernels use more mmap randomness than TSAN supports.
      - name: Lower ASLR entropy for TSAN
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG="-O1 -g"
          -DMINIVEC_SANITIZE=${{ matrix.sanitizer }}
          -DMINIVEC_BUILD_PYTHON=OFF -DMINIVEC_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build -j 4

      # Timing and benchmark-style tests are skipped: they measure speed, not
      # memory or thread safety, and run many times slower under sanitizers.
      - name: Test
        run: >
          ctest --test-dir build --output-on-failure -j 4 -LE stress
          -E "HNSWBenchmark\\.|HNSWLatency\\.|HNSWAccuracy\\."

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install package
        run: python -m pip install . pytest

      - name: Test
        run: python -m pytest -q
